name: LNZ Defenda Parser

on:
  schedule:
    - cron: '35 3 * * *'   # 11:35 Київ (за зимовим часом UTC+2 / 11:35, за літнім UTC+3 / 10:35)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 pandas openpyxl requests lxml

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Run parser
        run: python parser_2.py

      - name: Send email with results
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - <<'EOF'
          import requests, os, base64, datetime

          api_key = os.environ["RESEND_API_KEY"]
          email_to = os.environ["EMAIL_TO"]
          updated = datetime.datetime.now().strftime("%d.%m.%Y %H:%M")

          with open("lnz_defenda.xlsx", "rb") as f:
              file_data = base64.b64encode(f.read()).decode()

          response = requests.post(
              "https://api.resend.com/emails",
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json"
              },
              json={
                  "from": "LNZ Parser <onboarding@resend.dev>",
                  "to": [email_to],
                  "subject": f"LNZ Defenda ЗЗР — {updated}",
                  "html": f"<h2>🌿 LNZ Defenda — ЗЗР</h2><p>Оновлено: {updated}</p><p>Файл у вкладенні.</p>",
                  "attachments": [{
                      "filename": "lnz_defenda.xlsx",
                      "content": file_data
                  }]
              }
          )
          print(f"Status: {response.status_code}")
          print(response.text)
          EOF

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add lnz_defenda.xlsx
          git stash --include-untracked
          git pull --rebase origin main
          git stash pop || true
          git add lnz_defenda.xlsx
          git diff --staged --quiet || (git commit -m "Update LNZ results" && git push origin main)
