name: Growex Parser

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pandas openpyxl
          pip list
          python -c "import requests; print('requests OK')"

      - name: Run parser
        run: python parser.py

      - name: Generate HTML page
        run: |
          python - <<'EOF'
          import pandas as pd
          import datetime

          df = pd.read_excel("growex_zzr.xlsx")
          updated = datetime.datetime.now().strftime("%d.%m.%Y %H:%M")

          rows = ""
          for _, p in df.iterrows():
              rows += f"""
              <tr>
                <td><a href="{p.get('URL','')}" target="_blank">{p.get('Назва','')}</a></td>
                <td>{p.get('Ціна','')}</td>
                <td>{p.get('Ціна_за_літр','')}</td>
                <td>{p.get('Виробник','')}</td>
              </tr>"""

          html = f"""<!DOCTYPE html>
          <html lang="uk">
          <head>
            <meta charset="UTF-8">
            <title>Growex — ЗЗР</title>
            <style>
              body {{ font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }}
              h1 {{ color: #2c7a2c; }}
              p {{ color: #666; }}
              table {{ border-collapse: collapse; width: 100%; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }}
              th, td {{ border: 1px solid #ddd; padding: 10px; text-align: left; }}
              th {{ background: #2c7a2c; color: white; }}
              tr:nth-child(even) {{ background: #f9f9f9; }}
              tr:hover {{ background: #e8f5e9; }}
              input {{ margin: 10px 0; padding: 10px; width: 300px; border: 1px solid #ccc; border-radius: 4px; }}
              a {{ color: #2c7a2c; }}
            </style>
          </head>
          <body>
            <h1>🌿 Growex — Засоби захисту рослин</h1>
            <p>Оновлено: {updated} | Товарів: {len(df)}</p>
            <input type="text" id="search" placeholder="🔍 Пошук товару..." onkeyup="filter()">
            <table id="table">
              <thead><tr>
                <th>Назва</th>
                <th>Ціна</th>
                <th>Ціна за літр</th>
                <th>Виробник</th>
              </tr></thead>
              <tbody>{rows}</tbody>
            </table>
            <script>
              function filter() {{
                const q = document.getElementById('search').value.toLowerCase();
                document.querySelectorAll('#table tbody tr').forEach(r => {{
                  r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none';
                }});
              }}
            </script>
          </body>
          </html>"""

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html)
          print("index.html створено")
          EOF

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add growex_zzr.xlsx index.html
          git diff --staged --quiet || git commit -m "Update parser results"
          git push
