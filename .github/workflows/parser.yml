              rows += f"""
              <tr>
                <td><a href="{p['url']}" target="_blank">{p['name']}</a></td>
                <td>{p['unit_price']}</td>
                <td>{p['total_price']}</td>
                <td>{p['availability']}</td>
              </tr>"""

